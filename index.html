<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digimon Database</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
</head>
<body>
    <nav id="top">
        <div class="container">
            <div class="row">
                <div class="nav__wrapper">
                    <div class="nav__logo">
                        <img class="nav__img" src="https://i.redd.it/lti6z5yqm8h31.png" alt="logo">
                    </div>
                    <div class="nav__filter">
                        <select name="" id="api__dropdown" onchange="rankDisplay(event)" class="nav__dropdown">
                            <option value="">~ Select an Item ~</option>
                            <option value="Fresh">Freshs</option>
                            <option value="In Training">In Trainings</option>
                            <option value="Rookie">Rookies</option>
                            <option value="Champion">Champions</option>
                            <option value="Ultimate">Ultimates</option>
                            <option value="Mega">Megas</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    <section id="search">
        <div class="container">
            <div class="row">
                <div class="search__wrapper">
                    <input class="search__bar" type="text" id="searchInput" placeholder="Search by name..." oninput="onSearchChange(event)">
                </div>
            </div>
        </div>
    </section>
    <section id="landing">
        <div class="container">
            <div class="landing__row">
                <div class="landing__card" >
                    <h2>DIGIMON NAME:</h2>
                    <p></p>
                    <img src="">
                    <h2>RANK:</h2>
                    <p></p>
                </div>
            </div>
        </div>
    </section>
    <footer>
        <div class="container">
            <div class="row">
                <div class="footer__box">
                    <a class="button--text" href="#top">Back to Top</a>
                    <img class="nav__img" src="https://i.redd.it/lti6z5yqm8h31.png" alt="logo">
                    <a class="button--text">Made by CobyShelton</a>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
